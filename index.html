<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax Calculator</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="app-header">
      <span class="badge">tax-calculator</span>
      <h1>Tax Calculator</h1>
      <p class="sub">Progressive federal income tax calculation engine</p>
    </div>

    <form id="tax-form" onsubmit="calculate(event)">
      <div class="field">
        <label for="gross-income">Your Total Income</label>
        <input type="number" id="gross-income" value="82000" min="0" step="0.01" required>
      </div>

      <div class="field">
        <label for="tax-due">Tax Due</label>
        <input type="number" id="tax-due" value="0" min="0" step="0.01">
      </div>

      <div class="field">
        <label for="deductions">Deductions</label>
        <input type="number" id="deductions" value="5000" min="0" step="0.01">
      </div>

      <div class="field">
        <label for="vat-base">VAT-able Spend</label>
        <input type="number" id="vat-base" value="2400" min="0" step="0.01">
      </div>

      <div class="field">
        <label for="vat-rate">VAT Rate (%)</label>
        <input type="number" id="vat-rate" value="20" min="0" step="0.01">
      </div>

      <button type="submit" id="calculate" class="btn-calculate">Calculate</button>
    </form>

    <div class="results" id="results">
      <div class="result-row">
        <span class="result-label">Taxable Income:</span>
        <span class="result-value" id="r-taxable">$77,000.00</span>
      </div>
      <div class="result-row">
        <span class="result-label">Taxes Owed:</span>
        <span class="result-value" id="r-tax">$12,243.50</span>
      </div>
      <div class="result-row">
        <span class="result-label">VAT:</span>
        <span class="result-value" id="r-vat">$480.00</span>
      </div>
      <div class="result-row">
        <span class="result-label">Effective Rate:</span>
        <span class="result-value" id="r-rate">14.93%</span>
      </div>
      <div class="result-row take-home">
        <span class="result-label">Take-Home Pay:</span>
        <span class="result-value" id="r-take">$69,276.50</span>
      </div>
    </div>
  </main>

  <script src="taxCalculator.js"></script>
  <script src="script.js"></script>
</body>
</html>
