# Tekton Pipeline Definition for Tax Calculator CI/CD Automation
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
  labels:
    app.kubernetes.io/part-of: tax-calculator
spec:
  description: End-to-end CI/CD Pipeline for Tax Calculator (Clone -> Install -> Test -> Build -> Deploy)
  params:
    - name: repo-url
      description: Git repository clone URL
      type: string
    - name: revision
      description: Git branch or commit revision
      type: string
      default: main
    - name: image-reference
      description: Target container registry image URL
      type: string
  workspaces:
    - name: shared-workspace
      description: Shared workspace volume for source code and artifacts
  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)

    - name: npminstall
      taskRef:
        name: npminstall
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: tests
      taskRef:
        name: tests
      runAfter:
        - npminstall
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build
      taskRef:
        name: buildah
      runAfter:
        - tests
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(params.image-reference)

    - name: deploy
      taskRef:
        name: deploy
      runAfter:
        - build
      workspaces:
        - name: source
          workspace: shared-workspace
